// v45 (round-53): RN 0.77 moved autolinking INTO the React Native
// Gradle Plugin (the old applyNativeModulesSettingsGradle hook from
// @react-native-community/cli-platform-android is gone). This is the
// official 0.77 template form — paths adapted to this repo.
pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }

rootProject.name = 'sela'
include ':app'
includeBuild("../node_modules/@react-native/gradle-plugin")
