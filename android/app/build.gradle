apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    // v45 (round-53): RN 0.75+ — turns every autolinked library project
    // (screens, svg, mmkv, op-sqlite, fast-tflite, netinfo, slider,
    // safe-area) into a Gradle dependency of :app so their codegen
    // tasks run BEFORE the app's CMake configure. Without this call the
    // CXX build fails with "add_subdirectory ... codegen/jni/ which is
    // not an existing directory".
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

// v22 (round-28 #6): the PLAY STORE release signing — a
// keystore.properties file next to this build script carries the
// merchant's own key (abdala hanouna). When it is absent (CI, fresh
// clones) the release falls back to the debug key exactly as
// before, so the workflow never breaks.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.sela.pal"
    defaultConfig {
        applicationId "com.sela.pal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 53
        versionName "45.0.0"
    }

    // Prevent Android from compressing the bundled .tflite model in the APK.
    // mmap-ing an uncompressed asset is significantly faster to load.
    // (aaptOptions form is the one guaranteed to work on AGP 8.2.1)
    aaptOptions {
        noCompress 'tflite'
    }

    // v45 (round-53): Google Play requires 16 KB page-size alignment for
    // every 64-bit native lib in apps targeting API 35+. op-sqlite ships
    // two OPTIONAL prebuilt SQLite extensions (crsqlite = CRDT sync,
    // sqlite_vec = vector search) that are 4 KB-aligned and are NEVER
    // loaded by this app (no loadExtension calls anywhere in src/).
    // Excluding them from packaging keeps the AAB 16 KB-clean with zero
    // functional impact — the core SQLite engine compiles from source
    // inside libop-sqlite.so with the aligned NDK r27 toolchain.
    packaging {
        jniLibs {
            excludes += ["**/libcrsqlite.so", "**/libsqlite_vec.so"]
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // v22 (round-28 #6): the merchant's Play key — loaded ONLY
        // when keystore.properties exists (never committed).
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            // v22: sign with the merchant's Play key when present,
            // otherwise keep the debug-key behaviour (CI APKs).
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Explicit androidx.core for NotificationCompat (stock alerts).
    implementation("androidx.core:core-ktx:1.13.1")

    // v13 (round-19 #2): app-lock fingerprint prompt. RN 0.74's
    // ReactActivity extends AppCompatActivity (a FragmentActivity),
    // so BiometricPrompt plugs straight into MainActivity.
    implementation("androidx.biometric:biometric:1.1.0")

    // ── Camera stack v4 (hand-written CameraX + offline ML Kit) ──
    // v45 (round-53): 1.3.4 → 1.4.2 — the prebuilt
    // libimage_processing_util_jni.so inside camera-core 1.3.4 is
    // 4 KB-aligned; 1.4.2 ships it 16 KB-aligned (Play requirement).
    // The app uses only stable CameraX APIs (Preview/ImageCapture/
    // ImageAnalysis/ProcessCameraProvider) — no behavioral change.
    // All three use cases are bound 4:3 in one session (see
    // SelaCameraView); ML Kit barcode model is bundled = fully offline.
    implementation("androidx.camera:camera-core:1.4.2")
    implementation("androidx.camera:camera-camera2:1.4.2")
    implementation("androidx.camera:camera-lifecycle:1.4.2")
    implementation("androidx.camera:camera-view:1.4.2")
    implementation("com.google.mlkit:barcode-scanning:17.3.0")

    // v33 (round-41 #3): عامل WorkManager يقرأ إعدادات التاجر من نفس
    // مخزن MMKV الذي يستخدمه التطبيق. v45 (round-53): رُفع الاعتماد
    // المباشر إلى 1.3.15 — نفس خط 1.3.x (نفس الـ API تماماً) لكن
    // مكتبته الأصلية libmmkv.so محاذاة على 16 KB كما يتطلب متجر
    // Google Play لتطبيقات API 35+ (1.3.9 كانت 4 KB).
    implementation("androidx.work:work-runtime-ktx:2.9.0")
    implementation("com.tencent:mmkv:1.3.15")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// v45 (round-53): RN 0.77 autolinking — the plugin applied above
// ("com.facebook.react") + the settings.gradle autolinkLibrariesFromCommand
// handle every native module; the legacy cli-platform-android script hook
// is gone from RN 0.77 (package no longer ships native_modules.gradle).
