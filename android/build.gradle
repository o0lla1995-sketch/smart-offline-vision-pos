buildscript {
    ext {
        // v45 (round-53): Google Play requires target/compile SDK 36
        // (Android 16) since Aug 31, 2026. compileSdk 36 with AGP 8.7.2
        // (the version RN 0.77's gradle-plugin pins) needs the
        // `android.suppressUnsupportedCompileSdk=36` flag — set in
        // gradle.properties (community-proven combo, identical output).
        buildToolsVersion = "36.0.0"
        // 24 required by the camera stack.
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        // v45 (round-53): NDK r28.2 — unlike r27, it links EVERY
        // from-source native lib with 16 KB max-page-size alignment by
        // default (a hard Google Play requirement for apps targeting
        // API 35+). Verified necessary: with r27 the from-source libs
        // that don't use RN's cmake-utils (op-sqlite, fast-tflite)
        // came out 4 KB-aligned.
        ndkVersion = "28.2.13676358"
        // RN 0.77's gradle-plugin pins Kotlin 2.0.21.
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
